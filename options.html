<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Настройки YM Downloader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 30px;
      max-width: 500px;
      color: #333;
    }
    h2 { margin-top: 0; }
    .note { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    .input-group { display: flex; gap: 10px; align-items: center; }
    input {
      flex: 1;
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 20px;
      font-size: 16px;
      background: #ffcc00;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #e6b800; }
    #status {
      margin-top: 15px;
      color: green;
      font-weight: bold;
      height: 20px;
    }
  </style>
</head>
<body>
  <h2>Настройки скачивания</h2>
  
  <p class="note">
    Здесь вы можете указать подпапку внутри вашей стандартной папки загрузок Chrome 
    (например, внутри <b>D:\1_Downloads\</b>).<br><br>
    Оставьте поле пустым, чтобы качать в корень папки загрузок.
  </p>

  <div class="input-group">
    <input type="text" id="subfolder" placeholder="Например: 1_Music" />
    <button id="save">Сохранить</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
