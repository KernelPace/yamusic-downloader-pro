<!DOCTYPE html>
<html style="background: #121212;">
<head>
  <meta charset="utf-8">
  <style>
    /* Базовые настройки окна */
    body {
      margin: 0; padding: 0; width: 340px;
      min-height: 120px; /* ДАЕМ МЕСТО ДЛЯ ОШИБКИ ПРИ СТАРТЕ */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff; position: relative;
      overflow: hidden; /* ЗАЩИТА ОТ СКРОЛЛБАРОВ */
    }
	
	/* Кастомное выделение текста под стиль бренда */
    ::selection {
      background: rgba(255, 204, 0, 0.3); /* Фирменный желтый с прозрачностью */
      color: #fff;
    }
    ::-moz-selection {
      background: rgba(255, 204, 0, 0.3);
      color: #fff;
    }

    /* Размытый фон (на весь экран) */
    #bg-blur {
      position: fixed;
      top: -10%; left: -10%; right: -10%; bottom: -10%;
      background-size: cover;
      background-position: center;
      filter: blur(30px) brightness(0.35);
      z-index: 1;
      transition: background-image 0.5s ease-in-out;
    }

    /* Главный контейнер */
    #content-wrapper {
      position: relative;
      z-index: 2;
      padding: 20px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    #player { 
      display: none; 
      flex-direction: column; 
      align-items: center; 
      width: 100%;
    }

    /* =========================================
       БЛОК 1: ПУЛЬТ УПРАВЛЕНИЯ (НАВЕРХУ)
       ========================================= */
    .control-panel {
      background: rgba(0, 0, 0, 0.85); /* СДЕЛАЛИ ЯВНО ТЕМНЕЕ */
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-top: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 22px;
      width: 100%;
      padding: 18px 20px;
      box-sizing: border-box;
      margin-bottom: 24px;
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }

    /* Переключение треков (верхний ряд в пульте) */
    .main-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    /* Действия (нижний ряд в пульте) - ИДЕАЛЬНОЕ ЦЕНТРИРОВАНИЕ */
    .action-controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr; /* Центральная колонка по размеру Лайка */
      align-items: center;
      width: 100%;
    }
    #btn-dislike { justify-self: end; margin-right: 18px; }
    #btn-like { justify-self: center; }
    #btn-download { justify-self: start; margin-left: 18px; }

    /* Настоящие кликабельные ссылки */
    a.clickable {
      text-decoration: none;
      display: block;
      transition: all 0.2s ease;
	  color: #fff;
    }
    a.title:hover, a.artist:hover {
      text-decoration: underline; /* Подчеркивание текста */
      color: #ffcc00; /* Фирменный желтый при наведении */
    }
    #cover-link { display: block; margin-bottom: 20px; transition: transform 0.2s; }
    #cover-link:hover { transform: scale(1.03); opacity: 0.85; }
    #cover-link .cover { margin-bottom: 0; } /* Убираем двойной отступ */

    /* Общие стили для кнопок */
    .btn {
      background: none; border: none; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      color: rgba(255,255,255,0.8);
      padding: 0;
      user-select: none;
    }
    .btn:hover { color: #fff; transform: scale(1.15); }
    .btn:active { transform: scale(0.95); }

    .btn-nav svg { width: 28px; height: 28px; fill: currentColor; }

    /* Кнопка Плей/Пауза */
    .btn-main {
      background: #ffcc00; color: #000; border-radius: 50%;
      width: 54px; height: 54px;
      /* Двойная тень: одна жесткая вниз, вторая - мягкое широкое свечение */
      box-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 25px rgba(255, 204, 0, 0.25);
    }
    .btn-main:hover {
      background: #ffe066; color: #000;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4), 0 0 35px rgba(255, 204, 0, 0.35);
    }
    .btn-main svg { width: 24px; height: 24px; fill: currentColor; }

    /* Кнопки Лайк и Скачать */
    .btn-action {
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      width: 44px; height: 44px;
      /* Добавлено свойство, чтобы иконки из JS вставлялись правильно */
      color: #fff; 
    }
    .btn-action:hover { background: rgba(255,255,255,0.2); }
    .btn-action svg { width: 20px; height: 20px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    
    #btn-like.liked svg { fill: #ff3333; stroke: #ff3333; }
	
    /* Маленькая кнопка Дизлайка */
    .btn-action-small {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      width: 34px; height: 34px;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }
    .btn-action-small:hover { background: rgba(255, 80, 80, 0.2); color: #ff5050; }
    .btn-action-small svg { width: 16px; height: 16px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Окно подтверждения дизлайка */
    #dislike-confirm {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      border-radius: 22px; /* Подгоняем под форму пульта */
    }
    #dislike-confirm.show { display: flex; opacity: 1; }
    .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 17px; color: #fff; text-align: center; padding: 0 10px; line-height: 1.4; }
    .confirm-btns { display: flex; gap: 15px; }
    .confirm-btn {
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none;
    }
    .btn-yes { background: rgba(255, 80, 80, 0.2); color: #ff8888; border: 1px solid rgba(255, 80, 80, 0.4); }
    .btn-yes:hover { background: rgba(255, 80, 80, 0.4); color: #fff; }
    .btn-no { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-no:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
    
    /* Делаем обложку и текст кликабельными ссылками */
    .clickable { cursor: pointer; transition: transform 0.2s ease, opacity 0.2s; }
    .clickable:hover { transform: scale(1.03); opacity: 0.8; }

    /* Обложка */
    .cover {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      margin-bottom: 20px;
      object-fit: cover;
      /* Тончайшая рамка + глубокая многослойная тень */
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 32px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.3);
    }

    .title, .artist {
      display: block;
      width: 100%;
      white-space: normal;
      word-wrap: break-word;
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text;
      text-align: center;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 6px 0;
      line-height: 1.3;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .artist {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      margin: 0 0 8px 0;
      line-height: 1.4;
      font-weight: 500;
    }

    @keyframes ym-dl-spin { 100% { transform: rotate(360deg); } }
    /* =========================================
       БЛОК 3: ПОДВАЛ (ВЕРСИЯ И ДОНАТ)
       ========================================= */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 5px; /* УБРАЛИ ДЫРУ (было 20px) */
      padding-top: 12px; 
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }
    .version {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .settings-btn {
      background: none; border: none; padding: 0; cursor: pointer;
      color: rgba(255, 255, 255, 0.4); display: flex; align-items: center;
      transition: all 0.3s ease; outline: none;
    }
    .settings-btn:hover { color: #fff; transform: rotate(90deg); }
    .settings-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
	
    .donate-btn {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .donate-btn:hover {
      background: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      transform: translateY(-1px);
    }
    .donate-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* =========================================
       СИСТЕМНЫЕ УВЕДОМЛЕНИЯ
       ========================================= */
    #update-banner {
      display: none;
      width: 100%;
      box-sizing: border-box; /* ИМЕННО ЭТО ИСПРАВЛЯЕТ СМЕЩЕНИЕ */
      background: rgba(20, 20, 20, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 204, 0, 0.25);
      padding: 6px 12px; /* Вернули минимальную высоту */
      text-align: center;
      text-decoration: none;
      color: #ffcc00;
      font-size: 12px;
      font-weight: 500;
      position: relative;
      z-index: 10;
    }
    #update-banner:hover { background: rgba(30, 30, 30, 0.8); }
    
	#error-msg { 
      position: absolute;
      top: -50px; left: 50%;
      transform: translateX(-50%);
      width: 85%;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 80, 80, 0.4);
      color: #ff8888;
      text-align: center;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 12px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    /* Класс для плавного выезда ошибки */
    #error-msg.show {
      top: 20px;
      opacity: 1;
      pointer-events: auto;
    }
	
    /* =========================================
       БЛОК 4: ПРОГРЕСС-БАР (ПЕРЕМОТКА)
       ========================================= */
    .progress-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-top: 7px; /* Отступ от верхних кнопок */
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px; /* Отступ между цифрами и линией */
      padding: 0 2px;
      box-sizing: border-box;
    }
    #time-current, #time-total {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }
    #progress-bar {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15); /* Чуть светлее для контраста */
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      position: relative;
      background-image: linear-gradient(#ffcc00, #ffcc00);
      background-size: 0% 100%;
      background-repeat: no-repeat;
      transition: height 0.2s ease; /* Плавное расширение при наведении */
    }
    .progress-container:hover #progress-bar {
      height: 6px; /* Эффект Apple Music: полоска утолщается под мышкой */
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px; width: 12px; /* Чуть крупнее кружок */
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
    }
    #progress-bar::-moz-range-thumb {
      height: 12px; width: 12px; border: none;
      border-radius: 50%; background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
    }
    .progress-container:hover #progress-bar::-webkit-slider-thumb { opacity: 1; transform: scale(1.1); }
    .progress-container:hover #progress-bar::-moz-range-thumb { opacity: 1; transform: scale(1.1); }
  </style>
</head>
<body>
  <div id="bg-blur"></div>
  
  <!-- ТОНКИЙ БАННЕР ОБНОВЛЕНИЯ ВЕРХУ -->
  <a href="https://github.com/KernelPace/yamusic-downloader-pro/releases/latest" target="_blank" id="update-banner">
    ✨ Доступна новая версия: <span id="new-version-num"></span> (Нажмите для скачивания)
  </a>

  <!-- ВСПЛЫВАЮЩЕЕ СООБЩЕНИЕ ПОВЕРХ ВСЕГО -->
  <div id="error-msg">Пожалуйста, <b>обновите вкладку</b> Яндекс Музыки (F5) или включите трек.</div>

  <div id="content-wrapper">
    
    <div id="player">
      
      <!-- НОВЫЙ БЛОК: ПАНЕЛЬ УПРАВЛЕНИЯ ПРЯМО ПОД МЫШКОЙ -->
      <div class="control-panel">
        
        <div class="main-controls">
          <button id="btn-prev" class="btn btn-nav" title="Предыдущий трек">
            <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="4" x2="5" y2="20" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          
          <button id="btn-play" class="btn btn-main" title="Воспроизведение/Пауза">
            <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          
          <button id="btn-next" class="btn btn-nav" title="Следующий трек">
            <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
        </div>

        <div class="action-controls">
          <!-- КНОПКА ДИЗЛАЙКА -->
          <button id="btn-dislike" class="btn btn-action-small" title="Больше не рекомендовать">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
          </button>
		
          <button id="btn-like" class="btn btn-action" title="Мне нравится">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </button>
          
          <button id="btn-download" class="btn btn-action" title="Скачать MP3">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </button>
        </div>
		
        <!-- ПРОГРЕСС-БАР (ПЕРЕМОТКА) -->
        <div class="progress-container">
          <div class="time-row">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
          <input type="range" id="progress-bar" min="0" max="100" value="0" step="1">
        </div>

      </div>

      <!-- ВСПЛЫВАЮЩЕЕ ОКНО ПОДТВЕРЖДЕНИЯ (Скрыто по умолчанию) -->
      <div id="dislike-confirm">
        <div class="confirm-title">Пометить как «Не нравится»?<br><span style="font-size:13px; color:#aaa; font-weight:400">(Трек уберется из рекомендаций и переключится)</span></div>
        <div class="confirm-btns">
          <button id="dislike-yes" class="confirm-btn btn-yes">Да, пометить</button>
          <button id="dislike-no" class="confirm-btn btn-no">Отмена</button>
        </div>
      </div>

      <!-- НИЖНИЙ БЛОК: КРАСИВАЯ ИНФОРМАЦИЯ -->
      <a id="cover-link" target="_blank" title="Открыть трек">
        <img id="cover" class="cover clickable" src="icon.png" alt="Cover">
      </a>
      
      <a id="title" class="title clickable" target="_blank" title="Открыть трек">Загрузка...</a>
      <a id="artist" class="artist clickable" target="_blank" title="Искать артиста">Яндекс Музыка</a>

      <!-- ПОДВАЛ (ВЕРСИЯ И ДОНАТ) -->
      <div class="footer">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="version" id="app-version">v1.2.0</div>
          <button id="btn-settings" class="settings-btn" title="Настройки (папка загрузок)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
        <a href="https://pay.cloudtips.ru/p/5647818e" target="_blank" class="donate-btn" title="Поддержать автора">
          <svg viewBox="0 0 24 24"><path d="M20 8h-2.1c.06-.32.1-.66.1-1 0-2.76-2.24-5-5-5-1.95 0-3.64 1.11-4.48 2.73C7.68 3.1 6.01 2 4 2 1.24 2 -1 4.24 -1 7c0 .34.04.68.1 1H-3v3h1v10h18V12h1V8zm-11-1c0-1.65 1.35-3 3-3s3 1.35 3 3-1.35 3-3 3-3-1.35-3-3zM1 7c0-1.65 1.35-3 3-3s3 1.35 3 3-1.35 3-3 3-3-1.35-3-3zm16 13H3v-8h14v8zm2-10H-1V9h18v1z"/></svg>
          Поддержать ☕
        </a>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
